services:
  - type: web
    name: bharat-bank
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # node:sqlite needs Node 22.5 or newer
      - key: NODE_VERSION
        value: "22.23.4"
      - key: PUBLIC_DEPLOY
        value: "true"
      # Render prompts for these when the Blueprint is created. Do not commit real values.
      - key: BOLNA_API_KEY
        sync: false
      - key: BOLNA_AGENT_ID
        sync: false
      - key: UI_ACTION_TOKEN
        sync: false
      - key: CALLS_PER_IP_PER_HOUR
        value: "6"
      - key: CALLS_PER_DAY
        value: "100"
